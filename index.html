<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>AI LAB 수료증 확인</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root {
    --navy: #11294B; --gold: #B68F4D; --gold-soft: #F3E9D6; --paper: #FBF8F2;
    --ink: #1D2633; --muted: #6B6458; --line: #E6DDCB; --ok: #1F7A4D; --ok-bg: #E7F4EC;
    --warn: #8A5A00; --warn-bg: #FFF4DB; --bad: #B3261E; --bad-bg: #FCE8E6; --card: #FFFFFF;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--paper); color: var(--ink);
    font-family: Pretendard, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    line-height: 1.6; word-break: keep-all; overflow-wrap: anywhere;
  }
  main { max-width: 480px; margin: 0 auto; padding: 28px 16px 40px; }
  .brand { display: flex; align-items: baseline; gap: 10px; color: var(--navy); }
  .brand b { font-family: "Times New Roman", serif; font-size: 22px; letter-spacing: .02em; }
  .brand span { font-size: 13px; color: var(--muted); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 24px 22px; margin-top: 18px; }
  .badge { display: inline-flex; align-items: center; gap: 6px; font-weight: 700; font-size: 14px; padding: 6px 12px; border-radius: 999px; }
  .badge.ok { color: var(--ok); background: var(--ok-bg); }
  .badge.bad { color: var(--bad); background: var(--bad-bg); }
  .badge.wait { color: var(--warn); background: var(--warn-bg); }
  .name { font-size: 40px; font-weight: 800; color: var(--navy); letter-spacing: -0.01em; margin: 14px 0 2px; line-height: 1.25; }
  .sub { color: var(--muted); font-size: 15px; margin: 0; }
  dl { margin: 20px 0 0; display: grid; grid-template-columns: auto 1fr; gap: 10px 16px; font-size: 15px; }
  dt { color: var(--muted); }
  dd { margin: 0; font-weight: 600; font-variant-numeric: tabular-nums; }
  h2 { font-size: 15px; margin: 0 0 12px; color: var(--navy); }
  .row { display: flex; gap: 12px; align-items: flex-start; padding: 12px 0; border-top: 1px solid var(--line); font-size: 15px; }
  .row:first-of-type { border-top: 0; padding-top: 0; }
  .dot { flex: none; width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-size: 13px; font-weight: 800; margin-top: 1px; }
  .dot.ok { background: var(--ok-bg); color: var(--ok); }
  .dot.wait { background: var(--warn-bg); color: var(--warn); }
  .dot.bad { background: var(--bad-bg); color: var(--bad); }
  .row p { margin: 2px 0 0; color: var(--muted); font-size: 13.5px; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; word-break: break-all; }
  a { color: var(--navy); font-weight: 600; }
  .btn { display: inline-block; margin-top: 8px; padding: 10px 14px; border-radius: 10px; background: var(--navy); color: #fff; text-decoration: none; font-size: 14px; }
  .foot { margin-top: 22px; font-size: 12.5px; color: var(--muted); }
  .foot code { font-size: 12px; }
  input { width: 100%; font: inherit; padding: 12px 14px; border: 1px solid var(--line); border-radius: 10px; background: #fff; }
  .seal { width: 56px; height: 56px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #F4DDA0, var(--gold) 70%); display: grid; place-items: center; color: #fff; font: 700 12px/1.1 "Times New Roman", serif; text-align: center; float: right; box-shadow: 0 2px 6px rgba(120,90,30,.25); }
</style>
</head>
<body>
<main>
  <div class="brand"><b>AI LAB</b><span>수료증 발급 확인</span></div>
  <div id="app"><div class="card"><p class="sub">확인하는 중…</p></div></div>
  <div class="foot" id="foot"></div>
</main>
<script>
const $ = (h) => { const t = document.createElement('template'); t.innerHTML = h.trim(); return t.content; };
const esc = (s) => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const short = (a) => a.slice(0, 6) + '…' + a.slice(-4);

async function sha256hex(s) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s));
  return '0x' + [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('');
}

async function ethCall(cfg, data) {
  let last;
  for (const url of cfg.rpc) {
    try {
      const r = await fetch(url, { method: 'POST', headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ jsonrpc: '2.0', id: 1, method: 'eth_call', params: [{ to: cfg.contract, data }, 'latest'] }) });
      const j = await r.json();
      if (j.result) return j.result;
      last = j.error;
    } catch (e) { last = e; }
  }
  throw last || new Error('rpc');
}
const u256 = (n) => BigInt(n).toString(16).padStart(64, '0');

async function main() {
  const q = new URLSearchParams(location.search);
  const h = new URLSearchParams(location.hash.slice(1));
  const code = (q.get('c') || '').toUpperCase().replace(/[^0-9A-Z]/g, '');
  const tokenId = code ? parseInt(code, 36) : 0;  // 발급번호를 36진수로 읽은 값 = NFT 토큰 번호
  const key = h.get('k') || '';
  const name = (h.get('n') || '').normalize('NFC').trim();
  const [cfg, reg] = await Promise.all([
    fetch('config.json', { cache: 'no-store' }).then(r => r.json()),
    fetch('registry.json', { cache: 'no-store' }).then(r => r.json()),
  ]);
  const app = document.getElementById('app');
  document.getElementById('foot').innerHTML =
    `공식 확인 주소는 <b>betterforwhat.github.io/ailab-cert</b> 입니다. 다른 주소로 열렸다면 위조 페이지일 수 있습니다.` +
    (cfg.contract ? `<br>AI LAB 공식 컬렉션(Base): <code class="mono">${esc(cfg.contract)}</code>` : '');

  if (!code) {
    app.replaceChildren($(`<div class="card"><h2>수료증의 QR을 스캔해 주세요</h2>
      <p class="sub">종이 수료증 하단의 QR을 휴대전화 카메라로 찍으면 이 페이지에서 수료 여부가 확인됩니다.</p></div>`));
    return;
  }

  const expected = reg.entries[code];
  const known = !!expected;
  const matched = known && key && name && (await sha256hex(`AILAB|${code}|${name}|${key}`)) === expected;
  const certNo = `AI LAB-2026-${code}`;

  if (!matched) {
    app.replaceChildren($(`<div class="card">
      <span class="badge bad">✕ 확인되지 않은 수료증</span>
      <p class="sub" style="margin-top:14px">${known
        ? '발급번호는 있지만 이름 또는 확인 키가 일치하지 않습니다. 수료증의 QR을 직접 다시 스캔해 주세요.'
        : `${esc(certNo)}은(는) AI LAB이 발급한 번호가 아닙니다.`}</p></div>`));
    return;
  }

  app.replaceChildren($(`<div class="card">
      <div class="seal">AI<br>LAB</div>
      <span class="badge ok">✓ AI LAB 공식 수료증</span>
      <div class="name">${esc(name)}</div>
      <p class="sub">AI LAB 1기 교육과정을 수료했습니다.</p>
      <dl>
        <dt>발급번호</dt><dd>${esc(certNo)}</dd>
        <dt>교육 기간</dt><dd>2026년 9월 ~ 11월</dd>
        <dt>수료일</dt><dd>2026년 11월 17일</dd>
        <dt>발급</dt><dd>한국토지신탁 사내동아리 AI LAB</dd>
      </dl>
    </div>
    <div class="card" id="chain"><h2>디지털 수료증(NFT)</h2><p class="sub">Base 체인을 조회하는 중…</p></div>`));

  const box = document.getElementById('chain');
  const rows = [`<div class="row"><span class="dot ok">✓</span><div>AI LAB 발급 명단과 일치<p>이름·발급번호·QR 확인 키가 모두 맞습니다.</p></div></div>`];
  if (!cfg.contract) {
    rows.push(`<div class="row"><span class="dot wait">…</span><div>NFT 발급 준비 중<p>AI LAB이 Base에 수료증 컬렉션을 만드는 중입니다. 종이 수료증은 이미 유효합니다.</p></div></div>`);
    box.innerHTML = '<h2>디지털 수료증(NFT)</h2>' + rows.join('');
    return;
  }
  try {
    const [onHash, holderRaw] = await Promise.all([
      ethCall(cfg, '0xf19765ed' + u256(tokenId)),  // certHash(uint256)
      ethCall(cfg, '0xdbacc237' + u256(tokenId)),  // holderOf(uint256)
    ]);
    const holder = '0x' + holderRaw.slice(-40);
    const issued = !/^0x0{40}$/.test(holder);
    rows.push(onHash.toLowerCase() === expected.toLowerCase()
      ? `<div class="row"><span class="dot ok">✓</span><div>Base 체인 등록 기록 일치<p>AI LAB 컬렉션에 이 수료증이 등록되어 있어 누구도 고칠 수 없습니다.</p></div></div>`
      : `<div class="row"><span class="dot wait">…</span><div>체인 등록 대기<p>운영진이 곧 Base 체인에 등록합니다.</p></div></div>`);
    rows.push(issued
      ? `<div class="row"><span class="dot ok">✓</span><div>NFT 발급 완료<p>소유 지갑 <span class="mono">${esc(short(holder))}</span> · 양도할 수 없는 수료증입니다.</p>
          <a class="btn" href="${esc(cfg.explorer)}/nft/${esc(cfg.contract)}/${tokenId}" target="_blank" rel="noopener">BaseScan에서 발급 기록 보기</a></div></div>`
      : `<div class="row"><span class="dot wait">…</span><div>NFT 발급 대기<p>지갑 주소를 AI LAB 운영진에게 보내 주시면 이 번호로 NFT를 발급해 드립니다. 종이 수료증은 그대로 유효하며 다시 인쇄할 필요가 없습니다.</p></div></div>`);
  } catch (e) {
    rows.push(`<div class="row"><span class="dot wait">!</span><div>체인 조회 실패<p>잠시 후 새로고침해 주세요.</p></div></div>`);
  }
  box.innerHTML = '<h2>디지털 수료증(NFT)</h2>' + rows.join('');
}
main().catch(() => {
  document.getElementById('app').innerHTML = '<div class="card"><p class="sub">페이지를 불러오지 못했습니다. 잠시 후 다시 시도해 주세요.</p></div>';
});
</script>
</body>
</html>
